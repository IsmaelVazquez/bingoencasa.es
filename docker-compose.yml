services:
    nginx:
        image: nginx:1.30-alpine
        ports:
            - "10.10.10.1:8163:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                PUID: ${PUID:-1000}
                PGID: ${PGID:-1000}
        volumes:
            - ./:/var/www/html
        environment:
            APP_ENV: ${APP_ENV:-dev}
            APP_DEBUG: ${APP_DEBUG:-1}

            # Xdebug (permitimos defaults, pero NO tocamos DATABASE_URL)
            XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
            XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
            XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            db:
                condition: service_healthy
        user: "1000:1000"
        working_dir: /var/www/html

    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-bingo_local}
            POSTGRES_USER: ${POSTGRES_USER:-bingo_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bingo_password}
        volumes:
            # PG 18 guarda los datos en /var/lib/postgresql/<major>/docker.
            # El volumen tiene que montarse en /var/lib/postgresql.
            - postgres_data:/var/lib/postgresql
        ports:
            - "127.0.0.1:54320:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bingo_user} -d ${POSTGRES_DB:-bingo_local}"]
            interval: 5s
            timeout: 5s
            retries: 12
        shm_size: 128mb

    vite:
        image: node:26-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
        ports:
            - "10.10.10.1:5175:5173"
        depends_on:
            - php
        volumes:
            - ./:/var/www/html
        environment:
            NODE_ENV: development
            CHOKIDAR_USEPOLLING: "true"
        tty: true

volumes:
    postgres_data:
        driver: local
