<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSoundEffect = (type) => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        try {
            const ctx = new AudioContext();
            if (type === 'WIN') {
                [0, 0.2, 0.4, 0.6].forEach((t, i) => {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = 523.25 * (1 + i * 0.25);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime + t); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.5);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.5);
                });
            } else if (type === 'FAIL') {
                [0, 0.3, 0.6].forEach((t, i) => {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.value = 200 - (i * 50);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime + t); gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + t + 0.4);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.4);
                });
            }
        } catch (e) { console.error("Audio error", e); }
    };

    // --- BINGO CARD GENERATOR (3x9 Structure, 14 Numbers) ---
    const generateBingoCard = (seed) => {
        let state = seed;
        const rand = () => { state = (state * 9301 + 49297) % 233280; return state / 233280; };

        const cols = Array.from({length: 9}, () => []);
        const colRanges = [[1, 9], [10, 19], [20, 29], [30, 39], [40, 49], [50, 59], [60, 69], [70, 79], [80, 90]];

        for (let c = 0; c < 9; c++) {
            const [min, max] = colRanges[c];
            cols[c].push(Math.floor(rand() * (max - min + 1)) + min);
        }

        let extra = 5;
        while (extra > 0) {
            const c = Math.floor(rand() * 9);
            if (cols[c].length < 3) {
                const [min, max] = colRanges[c];
                let num;
                do { num = Math.floor(rand() * (max - min + 1)) + min; } while (cols[c].includes(num));
                cols[c].push(num);
                extra--;
            }
        }
        cols.forEach(c => c.sort((a,b) => a-b));

        const grid = Array.from({length: 3}, () => Array(9).fill(null));

        for (let c = 0; c < 9; c++) {
            const colNums = cols[c];
            if (colNums.length === 3) {
                grid[0][c] = colNums[0]; grid[1][c] = colNums[1]; grid[2][c] = colNums[2];
            } else if (colNums.length === 2) {
                const pattern = (seed + c) % 3;
                if (pattern === 0) { grid[0][c] = colNums[0]; grid[1][c] = colNums[1]; }
                else if (pattern === 1) { grid[1][c] = colNums[0]; grid[2][c] = colNums[1]; }
                else { grid[0][c] = colNums[0]; grid[2][c] = colNums[1]; }
            } else {
                const row = (seed + c) % 2 === 0 ? 1 : (c % 2 === 0 ? 0 : 2);
                grid[row][c] = colNums[0];
            }
        }

        return { id: seed, grid: grid, flat: cols.flat().sort((a,b)=>a-b) };
    };

        Check: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>,
        X: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
        Search: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
        Mic: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
        Users: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
        Tv: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>,

    };

    const GlassButton = ({ children, onClick, active = false, variant = 'primary', disabled = false, className = '' }) => {
        const baseStyles = "px-4 py-3 rounded-2xl font-bold transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-2 backdrop-blur-md border shadow-lg select-none";
        const variants = {
            primary: active ? "bg-white text-black border-white shadow-[0_0_20px_rgba(255,255,255,0.3)]" : "bg-white/10 text-white border-white/10 hover:bg-white/20",
            danger: "bg-red-500/20 text-red-200 border-red-500/30 hover:bg-red-500/30 hover:border-red-400",
            ghost: "bg-transparent border-transparent text-white/60 hover:text-white hover:bg-white/5",
            line: "bg-cyan-500/20 text-cyan-200 border-cyan-500/30 hover:bg-cyan-500/30 hover:border-cyan-400 hover:shadow-[0_0_15px_rgba(6,182,212,0.3)]",
            bingo: "bg-yellow-500/20 text-yellow-200 border-yellow-500/30 hover:bg-yellow-500/30 hover:border-yellow-400 hover:shadow-[0_0_15px_rgba(234,179,8,0.3)]",
            success: "bg-green-500/20 text-green-200 border-green-500/30 hover:bg-green-500/30",
        };
        return <button onClick={onClick} disabled={disabled} className={`${baseStyles} ${variants[variant]} ${disabled ? 'opacity-30 cursor-not-allowed transform-none' : ''} ${className}`}>{children}</button>;
    };

    const Ball3D = ({ number, size = "md", animate = false }) => {
        const sizeClasses = {
            sm: "w-8 h-8 md:w-12 md:h-12 text-xs md:text-lg",
            md: "w-16 h-16 md:w-20 md:h-20 text-xl md:text-2xl",

    };

    const StatusBadge = ({ status }) => {
        const styles = { PLAYING: "bg-green-500/20 text-green-300 border-green-500/30", PAUSED: "bg-yellow-500/20 text-yellow-300 border-yellow-500/30", CHECKING: "bg-blue-500/20 text-blue-300 border-blue-500/30", STOPPED: "bg-slate-500/20 text-slate-300 border-slate-500/30" };
        const labels = { PLAYING: "EN JUEGO", PAUSED: "PAUSA", CHECKING: "COMPROBANDO", STOPPED: "ESPERANDO" };

    // --- BINGO LOGO COMPONENT (CLEAN VERSION) ---
    const BingoLogo = ({ className }) => (

            <img

    // --- PRINT FUNCTION MODERNIZED WITH GRID LINES ---
    const printCards = () => {
        const printWindow = window.open('', '_blank');
        if (!printWindow) { alert("Por favor, permite los pop-ups para imprimir"); return; }

        let htmlContent = `
                <html>
                <head>
                    <title>Cartones BingoEnCasa.es</title>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
                    <style>
                        @media print {
                            @page { margin: 0.5cm; }
                            body { -webkit-print-color-adjust: exact; margin: 0; padding: 0; background: white; }
                            .no-print { display: none !important; }
                            .page-break { page-break-after: always; }
                        }
                        body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #1f2937; }
                        .print-container { max-width: 210mm; margin: 0 auto; background: white; padding: 10mm; min-height: 297mm; }

                        .card-wrapper {
                            border: 2px solid #e5e7eb;
                            border-radius: 12px;
                            margin-bottom: 25px;
                            overflow: hidden;
                            position: relative;
                            background: white;
                            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                        }

                        .card-header {
                            background: #111827;
                            color: white;
                            padding: 8px 16px;
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                        }
                        .card-logo { display: flex; align-items: center; gap: 8px; }
                        .logo-text { font-weight: 900; font-size: 16px; letter-spacing: 0.05em; color: white; }
                        .logo-icon { width: 16px; height: 16px; background: #ef4444; transform: rotate(45deg); display: inline-block; }

                        .card-id-badge {
                            background: rgba(255,255,255,0.15);
                            padding: 4px 10px;
                            border-radius: 999px;
                            font-family: monospace;
                            font-size: 14px;
                            font-weight: bold;
                            border: 1px solid rgba(255,255,255,0.2);
                        }

                        .grid-container {
                            display: grid;
                            grid-template-columns: repeat(9, 1fr);
                            border-left: 1px solid #e5e7eb;
                            border-bottom: 1px solid #e5e7eb;
                            background: white;
                        }

                        .cell {
                            aspect-ratio: 4/3;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 24px;
                            font-weight: 800;

                        }

                        .cell.empty {
                            background: #fcfcfc;

                        }

                        .cut-line {

                            display: flex;

                </head>
                <body>
                    <div style="position: fixed; top: 20px; right: 20px; z-index: 100;" class="no-print">
                        <button onclick="window.print()" style="padding: 12px 24px; font-size: 16px; font-weight: bold; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.3);">

            `;

        for (let i = 1; i <= 10; i++) {
            const cardData = generateBingoCard(i);
            htmlContent += `
                    <div class="card-wrapper">

                        <div class="grid-container">

            cardData.grid.forEach(row => {
                row.forEach(cell => {

            htmlContent += `
                        </div>
                        <div class="card-footer">

                </button>

        );

    // --- MAIN APP ---
    const App = () => {
        const [appMode, setAppMode] = useState('LANDING'); // LANDING, SOLO, HOST_LOBBY, HOST_GAME
        const [roomCode, setRoomCode] = useState('XMAS-25');
        const [players, setPlayers] = useState([]);

        // Game State
        const [numbers] = useState(Array.from({ length: 90 }, (_, i) => i + 1));
        const [drawnNumbers, setDrawnNumbers] = useState([]);
        const [currentNumber, setCurrentNumber] = useState(null);
        const [gameStatus, setGameStatus] = useState('STOPPED');
        const [checkType, setCheckType] = useState(null);
        const [speed, setSpeed] = useState(3500);
        const [speechEnabled, setSpeechEnabled] = useState(true);
        const [history, setHistory] = useState([]);
        const [targetPrize, setTargetPrize] = useState('LÍNEA');
        const [resultPopup, setResultPopup] = useState(null); // 'WIN' or 'FAIL'
        const [resultMessage, setResultMessage] = useState('');

        // Check State
        const [checkMode, setCheckMode] = useState('AUTO');
        const [cardId, setCardId] = useState('');
        const [generatedCard, setGeneratedCard] = useState(null);
        const [manualNum, setManualNum] = useState('');
        const [manualCheckResult, setManualCheckResult] = useState(null);
        const [showTestCards, setShowTestCards] = useState(false);

        // Voice State
        const [voices, setVoices] = useState([]);
        const [selectedVoice, setSelectedVoice] = useState(null);

        const timerRef = useRef(null);
        const synth = window.speechSynthesis;

        // Safe voice loading to prevent blank screen
        useEffect(() => {
            if (!synth) return;
            const loadVoices = () => {
                const available = synth.getVoices().filter(v => v.lang.startsWith('es'));
                setVoices(available);
                if (available.length > 0) {
                    const premiumVoice = available.find(v => v.name.includes('Monica') || v.name.includes('Google') || v.name.includes('Premium'));
                    const standardVoice = available.find(v => v.lang === 'es-ES') || available[0];
                    setSelectedVoice(premiumVoice || standardVoice);
                }
            };
            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) { speechSynthesis.onvoiceschanged = loadVoices; }
        }, [synth]);

        const speakText = (text) => {
            if (!speechEnabled || !synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.1;
            if (selectedVoice) utterance.voice = selectedVoice;
            synth.speak(utterance);
        };

        const speakNumber = (num) => {
            if (!speechEnabled || !synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(num.toString());
            utterance.lang = 'es-ES';
            utterance.rate = speed < 2500 ? 1.2 : 1.0;
            if (selectedVoice) utterance.voice = selectedVoice;
            synth.speak(utterance);

            if (NICKNAMES[num] && speed > 2500) {
                const nick = new SpeechSynthesisUtterance(NICKNAMES[num]);
                nick.lang = 'es-ES';
                nick.pitch = 1.1;
                if (selectedVoice) nick.voice = selectedVoice;
                synth.speak(nick);
            }
        };

        const drawBall = () => {
            setDrawnNumbers(prev => {
                if (prev.length >= 90) { stopGame(); return prev; }
                const remaining = numbers.filter(n => !prev.includes(n));
                const newNumber = remaining[Math.floor(Math.random() * remaining.length)];
                setCurrentNumber(newNumber);
                setHistory(h => [newNumber, ...h].slice(0, 5));
                speakNumber(newNumber);
                return [newNumber, ...prev];
            });
        };

        useEffect(() => {
            if (gameStatus === 'PLAYING') {
                if(drawnNumbers.length === 0 && !currentNumber) drawBall();
                timerRef.current = setInterval(drawBall, speed);
            } else { clearInterval(timerRef.current); }
            return () => clearInterval(timerRef.current);
        }, [gameStatus, speed]);

        const togglePlayPause = () => {
            if (gameStatus === 'PLAYING') {
                setGameStatus('PAUSED');
                synth.cancel();
            } else if (drawnNumbers.length < 90) {
                setGameStatus('PLAYING');
                setCheckType(null);
                setResultPopup(null);
                if(drawnNumbers.length > 0) { speakText(`Continuamos para ${targetPrize.toLowerCase()}`); }
            }
        };

        const stopGame = () => {
            setGameStatus('STOPPED');
            clearInterval(timerRef.current);
            setCheckType(null);
            setTargetPrize('LÍNEA');
            setResultPopup(null);
        };

        const resetGame = () => {
            if(confirm("¿Seguro que quieres salir y volver al inicio?")) {
                stopGame(); setDrawnNumbers([]); setCurrentNumber(null); setHistory([]); synth.cancel();
                setAppMode('LANDING'); // Go back to landing
            }
        };

        const handleCheck = (type) => {
            setGameStatus('CHECKING');
            setCheckType(type);
            setCheckMode('AUTO');
            setCardId('');
            setGeneratedCard(null);
            setManualNum('');
            setManualCheckResult(null);
            setShowTestCards(false);
            setResultPopup(null);
            synth.cancel();
            speakText(type === 'LÍNEA' ? '¡Han cantado línea!' : '¡Han cantado bingo!');
        };

        const verifyCard = () => {
            if(!cardId || cardId < 1 || cardId > 10000) return;
            const card = generateBingoCard(parseInt(cardId));
            setGeneratedCard(card);
        };

        const checkManualNumber = () => {
            const n = parseInt(manualNum);
            if(n && n >= 1 && n <= 90) {
                setManualCheckResult(drawnNumbers.includes(n) ? 'FOUND' : 'NOT_FOUND');
            }
        };

        const resumeFromCheck = () => {
            setResultPopup('FAIL');
            setResultMessage('¡Falsa Alarma!');
            playSoundEffect('FAIL');
            speakText(`¡Cartón incorrecto! Continuamos para ${targetPrize.toLowerCase()}.`);

            setTimeout(() => {
                setResultPopup(null);
                setGameStatus('PAUSED');
            }, 3000);
        };

        const confirmCheck = () => {
            if (window.confetti) {
                window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
            setResultPopup('WIN');
            playSoundEffect('WIN');

            if (checkType === 'LÍNEA') {
                setResultMessage('¡LÍNEA CORRECTA!');
                speakText("¡Línea correcta! Seguimos para Bingo.");
                setTargetPrize('BINGO');
            } else if (checkType === 'BINGO') {
                setResultMessage('¡BINGO CORRECTO!');
                speakText("¡Bingo correcto! ¡Partida finalizada!");
            }

            setTimeout(() => {
                setResultPopup(null);
                setGameStatus('PAUSED');
                setCheckType(null);
            }, 4000);
        };

        const getSpeedLabel = (ms) => { if (ms >= 5000) return "Relax"; if (ms <= 2000) return "Turbo"; return "Normal"; };

        // Mock Lobby Join Logic
        useEffect(() => {
            if (appMode === 'HOST_LOBBY') {
                const mockNames = ['María', 'Juan', 'Papá', 'Abuela', 'Lucía', 'Pedro'];
                let i = 0;
                const interval = setInterval(() => {
                    if (i < mockNames.length) {
                        setPlayers(prev => [...prev, mockNames[i]]);
                        i++;
                    } else {
                        clearInterval(interval);
                    }
                }, 1500);
                return () => { clearInterval(interval); setPlayers([]); };
            }
        }, [appMode]);

        // --- CHECKER HELPERS ---
        // Check rows for lines
        const getRowStatus = (rowNums) => {
            if (!rowNums) return null;
            const filledCount = rowNums.filter(n => n !== null && drawnNumbers.includes(n)).length;
            const totalNums = rowNums.filter(n => n !== null).length;
            if (totalNums === 0) return 'EMPTY';
            return filledCount === totalNums ? 'COMPLETE' : 'INCOMPLETE';
        };

        const isBingo = (grid) => {
            return grid.every(row => getRowStatus(row) === 'COMPLETE' || getRowStatus(row) === 'EMPTY');
        };

        // --- RENDER ---

        if (appMode === 'LANDING') {
            return (
                <div className="relative w-screen h-screen flex flex-col overflow-hidden">
                    <div className="aurora-bg"><div className="blob blob-1"></div><div className="blob blob-2"></div><div className="blob blob-3"></div></div>
                    <LandingPage onSelectMode={(mode) => setAppMode(mode === 'SOLO' ? 'SOLO' : 'HOST_LOBBY')} />
                </div>
            );
        }

        if (appMode === 'HOST_LOBBY') {
            return (
                <div className="relative w-screen h-screen flex flex-col p-8 items-center justify-center overflow-hidden">
                    <div className="aurora-bg"><div className="blob blob-1"></div><div className="blob blob-2"></div><div className="blob blob-3"></div></div>

                    <div className="glass-panel p-12 rounded-3xl w-full max-w-5xl text-center relative animate-enter">
                        <button onClick={() => setAppMode('LANDING')} className="absolute top-6 left-6 text-white/50 hover:text-white flex items-center gap-2">
                            <Icons.RotateCcw className="w-4 h-4" /> Volver
                        </button>

                        <h2 className="text-2xl font-bold text-pink-300 uppercase tracking-widest mb-2">Sala Privada</h2>
                        <div className="text-8xl font-black text-white tracking-tighter mb-8 bg-clip-text text-transparent bg-gradient-to-r from-white to-white/70">
                            {roomCode}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12 mb-12">
                            <div className="bg-white p-4 rounded-2xl mx-auto w-48 h-48 flex items-center justify-center">
                                <div className="text-black font-mono text-center text-xs">
                                    [QR CODE PLACEHOLDER]<br/>
                                    Escanear para unirse
                                </div>
                            </div>
                            <div className="text-left">
                                <h3 className="text-white/50 uppercase tracking-widest text-sm font-bold mb-4">Jugadores ({players.length})</h3>
                                <div className="flex flex-wrap gap-2">
                                    {players.map((p, i) => (
                                        <div key={i} className="glass px-4 py-2 rounded-full flex items-center gap-2 animate-enter">
                                            <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                                            {p}
                                        </div>
                                    ))}
                                    {players.length === 0 && <span className="text-white/30 italic">Esperando jugadores...</span>}
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={() => setAppMode('SOLO')} // Reuse SOLO logic for now as game board is same
                            className="bg-gradient-to-r from-indigo-500 to-pink-500 px-12 py-6 rounded-2xl font-black text-2xl shadow-2xl hover:scale-105 transition-transform"
                        >
                            EMPEZAR PARTIDA
                        </button>
                    </div>
                </div>
            );

        // GAME VIEW (Shared for SOLO and HOST GAME for now)
        return (
            <div className="relative w-screen h-screen flex flex-col p-2 md:p-6 lg:p-8 overflow-hidden">

                        <div className="flex items-center gap-3">
                            <BingoLogo className="w-10 h-10 md:w-12 md:h-12" />
                            <div>
                                <h1 className="text-base md:text-lg font-black leading-none tracking-tight">BINGOENCASA<span className="opacity-50 font-normal">.ES</span></h1>
                            </div>
                        </div>
                        <div className="hidden md:block w-px h-6 bg-white/10"></div>
                        <div className="flex items-center gap-2 opacity-80 hover:opacity-100 transition-opacity">
                            <span className="text-[8px] md:text-[9px] uppercase tracking-widest text-white/40 mt-0.5">Creado por</span>
                            <img src="https://thrax.es/assets/logo_thrax-rojo-y-blanco.svg" alt="Thrax" className="h-5 md:h-6 w-auto" />

                    </div>
                    <div className="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-between md:justify-end border-t md:border-t-0 border-white/5 pt-2 md:pt-0">

                        <div className="flex gap-2">
                            <div className="h-4 md:h-6 w-px bg-white/10 mx-1"></div>
                            <button onClick={() => setSpeechEnabled(!speechEnabled)} className="p-1.5 md:p-2 rounded-full hover:bg-white/10 transition-colors">{speechEnabled ? <Icons.Volume2 className="w-4 h-4 md:w-5 md:h-5" /> : <Icons.VolumeX className="w-4 h-4 md:w-5 md:h-5 text-white/50" />}</button>
                            <button onClick={resetGame} className="p-1.5 md:p-2 rounded-full hover:bg-red-500/20 text-red-300 transition-colors" title="Salir al menú"><Icons.RotateCcw className="w-4 h-4 md:w-5 md:h-5" /></button>
                        </div>

                <main className="flex-1 flex flex-col lg:flex-row gap-4 md:gap-6 h-full relative z-10 pb-2 md:pb-4 overflow-hidden">

                        {/* Main Display Stage */}
                        <div className="glass-panel rounded-2xl md:rounded-3xl p-4 md:p-8 flex flex-col items-center justify-center relative overflow-hidden flex-grow transition-all">

                            {/* RESULTS POPUP OVERLAY */}
                            {resultPopup && (
                                <div className="absolute inset-0 z-50 bg-black/90 backdrop-blur-xl flex flex-col items-center justify-center animate-slide-up text-center p-8">
                                    <div className={`text-6xl mb-6 ${resultPopup === 'WIN' ? 'animate-bounce' : 'animate-pulse'}`}>
                                        {resultPopup === 'WIN' ? '🏆' : '🚫'}

                                        {resultMessage}

                                    {resultPopup === 'FAIL' && <p className="text-white/50 text-xl">Continuamos jugando...</p>}

                                                {checkType === 'BINGO' ? <Icons.Trophy className="w-5 h-5 md:w-6 md:h-6" /> : <Icons.List className="w-5 h-5 md:w-6 md:h-6" />}
                                            </div>
                                            <div><h2 className="text-lg md:text-xl font-bold uppercase tracking-tight">Verificar {checkType}</h2></div>

                                        <div className="flex bg-white/5 rounded-lg p-1">
                                            <button onClick={() => setCheckMode('AUTO')} className={`px-2 py-1 md:px-3 md:py-1 text-[10px] md:text-xs font-bold rounded-md transition-all ${checkMode === 'AUTO' ? 'bg-indigo-500 text-white shadow-lg' : 'text-white/40 hover:text-white'}`}>Auto</button>
                                            <button onClick={() => setCheckMode('MANUAL')} className={`px-2 py-1 md:px-3 md:py-1 text-[10px] md:text-xs font-bold rounded-md transition-all ${checkMode === 'MANUAL' ? 'bg-pink-500 text-white shadow-lg' : 'text-white/40 hover:text-white'}`}>Manual</button>
                                        </div>
                                    </div>

                                    {checkMode === 'AUTO' ? (
                                        <div className="flex flex-col items-center w-full max-w-md mx-auto">
                                            <div className="flex gap-2 w-full mb-6">
                                                <input type="number" placeholder="Nº Cartón (1-10000)" className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-base md:text-lg font-mono focus:outline-none focus:border-indigo-500 transition-colors text-center placeholder:text-white/20" value={cardId} onChange={(e) => setCardId(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && verifyCard()} />
                                                <GlassButton onClick={verifyCard} disabled={!cardId} variant="primary"><Icons.Search className="w-5 h-5" /></GlassButton>

                                            <button onClick={() => setShowTestCards(!showTestCards)} className="text-xs text-white/50 hover:text-white underline mb-4 transition-colors">{showTestCards ? 'Ocultar Cartones de Prueba' : '👁️ Ver Cartones de Prueba (1-5)'}</button>
                                            {showTestCards && (

                                                            <div className="text-white/50 text-xs">Faltan números</div>

                                                    </div>
                                                </div>

                                                <GlassButton onClick={checkManualNumber} disabled={!manualNum} variant="primary"><Icons.Check className="w-5 h-5" /></GlassButton>
                                            </div>
                                            {manualCheckResult && (<div className={`w-full p-4 rounded-xl flex items-center justify-center gap-3 mb-6 font-bold text-lg ${manualCheckResult === 'FOUND' ? 'bg-green-500/20 text-green-300 border border-green-500/30' : 'bg-red-500/20 text-red-300 border border-red-500/30'}`}>{manualCheckResult === 'FOUND' ? (<><Icons.Check className="w-6 h-6" /> ¡SÍ!</>) : (<><Icons.X className="w-6 h-6" /> ¡NO!</>)}</div>)}
                                        </div>
                                    )}
                                    <div className="mt-auto flex gap-3 w-full">
                                        <GlassButton variant="danger" className="flex-1 text-sm md:text-base" onClick={resumeFromCheck}>Falsa Alarma</GlassButton>
                                        <GlassButton variant="success" className="flex-1 text-sm md:text-base" onClick={confirmCheck}>Confirmar</GlassButton>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    <div className="absolute top-3 left-4 right-4 md:top-4 md:left-6 md:right-6 flex justify-between text-[10px] md:text-xs font-medium uppercase tracking-widest text-white/40">
                                        <span>Última bola</span><span>{drawnNumbers.length} / 90</span>
                                    </div>
                                    <div className="relative z-10 flex flex-col items-center justify-center h-full">
                                        {currentNumber ? (
                                            <div className="flex flex-col items-center">
                                                <div className="drop-shadow-2xl filter transform transition-transform duration-300">
                                                    <Ball3D number={currentNumber} size="xl" animate={true} />
                                                </div>
                                                <div className="mt-2 md:mt-4 text-center h-8">
                                                    {NICKNAMES[currentNumber] && <p className="text-base md:text-xl text-pink-300 font-medium animate-pulse-slow">"{NICKNAMES[currentNumber]}"</p>}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-center opacity-40">
                                                <div className="w-20 h-20 md:w-32 md:h-32 rounded-full border-2 border-dashed border-white/30 animate-spin-slow mx-auto mb-4 flex items-center justify-center">
                                                    <Icons.Play className="w-8 h-8 md:w-10 md:h-10 ml-1" />
                                                </div>
                                                <p className="text-sm md:text-lg font-light">Esperando sorteo...</p>
                                            </div>
                                        )}
                                    </div>
                                    <div className="absolute bottom-4 md:bottom-6 left-0 right-0 flex justify-center gap-2 md:gap-4 px-4 md:px-6">
                                        {history.slice(1).map((n, i) => (<div key={i} className="opacity-50 scale-75 transform transition-all hover:scale-90 hover:opacity-100"><Ball3D number={n} size="sm" /></div>))}
                                    </div>
                                </>
                            )}
                        </div>

                        {/* Control Panel */}
                        <div className="glass rounded-2xl md:rounded-3xl p-4 md:p-6 flex-shrink-0">
                            <div className="flex items-center justify-between mb-4 md:mb-6">
                                <div className="text-[10px] md:text-xs font-medium uppercase tracking-wider text-white/50">Control de Sala</div>
                                <div className="flex items-center gap-2 text-[10px] md:text-xs font-mono bg-black/20 px-2 py-1 rounded-lg"><span>{Math.round(speed/1000)}s</span><span className={`w-1.5 h-1.5 rounded-full ${speed < 2500 ? 'bg-pink-500' : 'bg-green-500'}`}></span></div>
                            </div>
                            <div className="flex flex-col gap-2 md:gap-3">
                                <GlassButton onClick={togglePlayPause} active={gameStatus === 'PLAYING'} disabled={drawnNumbers.length >= 90 || gameStatus === 'CHECKING'} className="w-full h-12 md:h-14 text-base md:text-lg">
                                    {gameStatus === 'PLAYING' ? <Icons.Pause className="w-5 h-5 md:w-6 md:h-6" /> : <Icons.Play className="w-5 h-5 md:w-6 md:h-6" />}
                                    {gameStatus === 'PLAYING' ? 'PAUSAR SORTEO' : drawnNumbers.length > 0 ? 'CONTINUAR SORTEO' : 'EMPEZAR BINGO'}
                                </GlassButton>
                                <div className="grid grid-cols-2 gap-2 md:gap-3 mt-1 md:mt-2">
                                    <GlassButton variant="line" onClick={() => handleCheck('LÍNEA')} disabled={gameStatus === 'CHECKING' || drawnNumbers.length === 0} className="h-12 md:h-16 text-lg md:text-xl tracking-tight"><Icons.List className="w-5 h-5 md:w-6 md:h-6" />¡LÍNEA!</GlassButton>
                                    <GlassButton variant="bingo" onClick={() => handleCheck('BINGO')} disabled={gameStatus === 'CHECKING' || drawnNumbers.length === 0} className="h-12 md:h-16 text-lg md:text-xl tracking-tight"><Icons.Trophy className="w-5 h-5 md:w-6 md:h-6" />¡BINGO!</GlassButton>
                                </div>
                                <div className="bg-black/20 rounded-xl p-3 md:p-4 mt-2">
                                    <div className="flex justify-between text-[10px] md:text-xs mb-2 md:mb-3 text-white/70"><span>Velocidad</span><span>{getSpeedLabel(speed)}</span></div>
                                    <input type="range" min="1500" max="6000" step="500" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-full accent-white" />
                                    <div className="flex justify-between mt-2 text-[8px] md:text-[10px] text-white/30 uppercase"><span>Rápido</span><span>Lento</span></div>
                                </div>
                                {voices.length > 0 && (
                                    <div className="bg-black/20 rounded-xl p-3 md:p-4 mt-2">
                                        <div className="flex justify-between text-[10px] md:text-xs mb-2 text-white/70"><span>Voz del Sistema</span><Icons.Mic className="w-3 h-3 opacity-50" /></div>
                                        <select value={selectedVoice ? selectedVoice.name : ''} onChange={(e) => { const v = voices.find(voice => voice.name === e.target.value); setSelectedVoice(v); }} className="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition-colors cursor-pointer truncate">
                                            {voices.map(v => (<option key={v.name} value={v.name} className="bg-slate-800 text-white">{v.name.replace('Microsoft', '').replace('Google', '').trim()}</option>))}
                                        </select>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Right Board */}
                    <div className="flex-[1.5] glass-panel rounded-2xl md:rounded-3xl p-4 md:p-8 flex flex-col h-full overflow-hidden">
                        <div className="flex justify-between items-center mb-4 md:mb-6 flex-shrink-0">
                            <h3 className="text-base md:text-lg font-semibold tracking-tight">Tablero</h3>
                            <div className="text-[10px] md:text-xs text-white/50">{90 - drawnNumbers.length} bolas restantes</div>
                        </div>
                        {/* Grid container with forced 9 rows */}
                        <div className="grid grid-cols-10 gap-1 h-full flex-1 min-h-0" style={{ gridTemplateRows: 'repeat(9, minmax(0, 1fr))' }}>
                            {numbers.map((num) => {
                                const isDrawn = drawnNumbers.includes(num);
                                const isCurrent = currentNumber === num;
                                return (
                                    <div key={num} className="relative flex items-center justify-center w-full h-full bg-white/5 rounded-md overflow-hidden">
                                        <div className={`
                                                flex items-center justify-center rounded-full
                                                font-bold transition-all duration-300
                                                aspect-square
                                                /* Maximize size while keeping circle shape inside rect cell */
                                                h-[92%] w-auto max-w-[92%]
                                                text-[10px] md:text-sm lg:text-base xl:text-xl
                                                ${isCurrent
                                            ? 'bg-[#ef4444] text-white shadow-[0_0_20px_rgba(239,68,68,0.6)] scale-105 z-20 animate-pulse'
                                            : isDrawn
                                                ? 'bg-white text-black shadow-sm scale-100 z-10'
                                                : 'text-white/20 hover:bg-white/10 scale-90'}
                                            `}>
                                            {num}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="mt-4 md:mt-6 pt-4 md:pt-6 border-t border-white/5 flex-shrink-0">
                            <div className="h-1 w-full bg-white/10 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-400 to-pink-400 transition-all duration-700 ease-out" style={{ width: `${(drawnNumbers.length / 90) * 100}%` }}></div></div>
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
